[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Trang", email = "truongthithuytrang140205@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
data-agent = "data_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
